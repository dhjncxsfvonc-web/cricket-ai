<!DOCTYPE html>
<html>
<head>
<title>Cricket AI Ultra Pro</title>
<style>
body {
    background: #020617;
    color: white;
    text-align: center;
    font-family: Arial;
}
input {
    padding: 10px;
    margin: 5px;
}
button {
    padding: 10px 20px;
    background: #22c55e;
    color: white;
}
.box {
    margin-top: 20px;
    font-size: 20px;
}
</style>
</head>

<body>

<h1>🏏 Cricket AI ULTRA PRO</h1>

<form method="POST">
<input name="team" placeholder="Team"><br>
<input name="opponent" placeholder="Opponent"><br>
<input name="team_score" placeholder="Team Score"><br>
<input name="opponent_score" placeholder="Opponent Score"><br>
<button>Predict</button>
</form>

<div class="box">
{{ result }}<br>
{{ probability }}<br>
{{ explanation }}
</div>

</body>
</html>
