<!DOCTYPE html>
<html>
<head>
    <title>Cricket AI Predictor</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: white;
            margin-top: 80px;
        }

        h1 {
            font-size: 40px;
        }

        input {
            padding: 12px;
            width: 250px;
            border-radius: 10px;
            border: none;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            background: #ff9800;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #e68900;
        }

        .card {
            margin-top: 30px;
            padding: 20px;
            background: white;
            color: black;
            border-radius: 15px;
            display: inline-block;
        }
    </style>
</head>
<body>

    <h1>🏏 Cricket AI Predictor</h1>

    <form method="POST">
        <input type="text" name="team" placeholder="Enter team name" required>
        <br><br>
        <button type="submit">Predict</button>
    </form>

    {% if result %}
    <div class="card">
        <h2>{{ result.team }}</h2>
        <h3>Win Probability: {{ result.prob }}%</h3>
        <p>{{ result.verdict }}</p>
    </div>
    {% endif %}

</body>
</html>
